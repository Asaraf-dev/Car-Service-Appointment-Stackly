
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0e12">
    <meta name="robots" content="noindex, nofollow">
    <title>404 — Road Not Found | Car Service Appointment Portal</title>
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/404.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <!--- 404 Page --->
    <main class="cs-404-page">
        <!--- Background Effects --->
        <div class="cs-404-grid"></div>
        <div class="cs-404-glow cs-404-glow-one"></div>
        <div class="cs-404-glow cs-404-glow-two"></div>
        <div class="cs-404-particles" id="cs-404-particles"></div>

        <!--- Main Error Content --->
        <section class="cs-404-content" aria-labelledby="cs-404-title">
            <div class="cs-404-error-label"><span></span> ERROR CODE: 404</div>
            <div class="cs-404-number" aria-hidden="true">
                <span>4</span><span class="cs-404-number-zero">0</span><span>4</span>
            </div>
            <!--- Automotive Illustration --->
            <div class="cs-404-visual" aria-hidden="true">
                <div class="cs-404-visual-ring cs-404-ring-one"></div>
                <div class="cs-404-visual-ring cs-404-ring-two"></div>
                <div class="cs-404-road">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
                <div class="cs-404-car"><i class="bi bi-car-front-fill"></i></div>
                <div class="cs-404-visual-caption">DESTINATION UNKNOWN</div>
            </div>
            <h1 id="cs-404-title">Looks like you've <span>taken a wrong turn.</span></h1>
            <p class="cs-404-description">The page you're looking for has left the route. It may have moved, been removed, or never existed.</p>
            <!--- Navigation Actions --->
            <div class="cs-404-actions">
                <button type="button" class="cs-404-btn cs-404-btn-primary" id="cs-404-back">
                    <i class="bi bi-arrow-left"></i><span>Go Back</span>
                </button>
                <a href="index.html" class="cs-404-btn cs-404-btn-secondary">
                    <i class="bi bi-house-door"></i><span>Go to Home</span><i class="bi bi-arrow-up-right cs-404-btn-arrow"></i>
                </a>
            </div>
            <p class="cs-404-help"><i class="bi bi-info-circle"></i> Need help finding your way? <a href="contact.html">Contact our team</a></p>
        </section>

    </main>
    <script src="assets/js/404.js"></script>
</body>
</html>
